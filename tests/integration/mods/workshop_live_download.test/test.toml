timeout = 120

tags = ["headful", "ci-host-blocked", "exclusive"]

[[services]]
name = "master"
type = "master-server"
port = 0
db = "${output}/master.sqlite3"
extra_args = ["--mods-dir", "${output}/master-mods"]

[[services.seed_mods]]
id = "fixturemod"
name = "Fixture Mod"
version = "1.2.3"
app = "CWR"
actver = 303
folder = "@fixturemod"
source = "tests/integration/mods/workshop_live_download.test/revision1"
description = "Tiny downloadable fixture mod for Trident live workshop tests."
authors = ["CWR test fixture"]

[[services.seed_mods.updates]]
source = "tests/integration/mods/workshop_live_download.test/revision2"
version = "1.2.3"

[[instances]]
name = "client"
type = "client"
use_mission = false
no_autotest = true
copy_files = [
    { source = "revision1/mod.json", target = "content/Workshop/@fixturemod/mod.json" },
    { source = "revision1/revision.txt", target = "content/Workshop/@fixturemod/revision.txt" },
    { source = "revision1/stale.txt", target = "content/Workshop/@fixturemod/stale.txt" },
]
extra_args = [
    "--no-strict",
    "--lang",
    "English",
    "--master-server",
    "${master.url}",
    "--mods-dir",
    "${output}/local-mods",
]
