tags = ["network"]

[[http_fixtures]]
url = "https://squad.test/squad.xml"
file = "fixtures/squad.xml"
min_requests = 1

[[http_fixtures]]
url = "https://squad.test/synthetic_grid.paa"
file = "fixtures/synthetic_grid.paa"
